[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
langchain = "1.5.2"
langchain-core = "1.8.2"
langgraph = "1.2.19"
langchain-deepseek = "1.2.1"
langchain-openai = "1.8.2"
openai = "2.45.0"
httpx = "0.28.1"
sqlalchemy = "2.0.43"
psycopg = { version = "3.3.9", extras = ["binary"] }
alembic = "1.20.1"
python-dotenv = "1.1.1"
tzdata = "2025.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
