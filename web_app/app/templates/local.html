<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>旅行客服</title>
<style>
:root { font: 16px/1.55 system-ui, sans-serif; color: #142923; background: #f4f7f5; }
body { margin: 0; }
main { max-width: 950px; margin: auto; padding: 30px 20px; }
header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
h1 { font-size: 2.2rem; margin: 0; }
h2 { font-size: 1.1rem; margin: 0 0 12px; }
p { margin: .4em 0; }
a { color: #245c49; }
form { display: flex; gap: 10px; flex-wrap: wrap; }
section, article { background: white; border: 1px solid #d6e1dc; border-radius: 12px; padding: 18px; margin: 14px 0; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.grid article { margin: 0; }
input, button, select { font: inherit; padding: 8px 11px; border: 1px solid #afc2ba; border-radius: 7px; background: white; }
button { background: #245c49; color: white; cursor: pointer; }
button:disabled { opacity: .55; cursor: wait; }
pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: .88rem; }
small { color: #486156; }
[hidden] { display: none !important; }
#status { min-height: 1.6em; }
#messages { padding-left: 20px; overflow-wrap: anywhere; }
@media (max-width: 650px) { .grid { grid-template-columns: 1fr; } }
</style>
<main>
<header><h1>旅行客服</h1><a href="/docs">API 文档</a></header>
<p id="status" role="status"></p>
<section id="login-panel">
<h2>演示登录</h2>
<form id="login"><input name="username" value="demo-a" aria-label="账号" required autocomplete="username"><input name="password" type="password" aria-label="密码" placeholder="本地演示密码" required autocomplete="current-password"><button>登录</button></form>
</section>
<div id="app-panel" hidden>
<section><header><h2>会话</h2><button id="logout" type="button">退出</button></header>
<form id="session"><button id="new-thread" type="button">新建会话</button><input id="thread" aria-label="会话 ID" placeholder="会话 ID"><button>打开会话</button></form>
<small id="graph"></small><ul id="messages"></ul><p id="hotel-reply" aria-live="polite"></p><ul id="hotel-options"></ul><section id="booking" aria-live="polite" hidden></section>
<form id="send"><input name="content" aria-label="消息" placeholder="输入消息" required maxlength="4000"><button>发送</button></form></section>
<div class="grid"><article><h2>本人航班</h2><p><small>合成行程 · 结果标明模型模式与机场数据来源</small></p><form id="flight"><select id="flights" aria-label="航班"><option value="">选择航班</option></select><button>查航班</button></form><pre id="flight-result"></pre></article>
<article><h2>机场城市</h2><p><small>本地 MCP 示例目录</small></p><form id="airport"><input name="code" aria-label="机场代码" value="ZRH" maxlength="3" required><button>查城市</button></form><pre id="airport-result"></pre></article></div>
</div>
</main>
<script>
const $ = id => document.getElementById(id);
let viewGeneration = 0;
let authGeneration = 0;
function clearThreadView() {
  ++viewGeneration;
  renderHotel(null);
  renderBooking(null);
  $('messages').replaceChildren();
  $('graph').textContent = '';
}
$('thread').addEventListener('input', clearThreadView);
async function api(path, body) {
  const options = body === undefined ? {} : {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)};
  const response = await fetch(path, options);
  const data = response.status === 204 ? null : await response.json();
  if (!response.ok) {
    const detail = data?.detail || String(response.status);
    throw new Error(data?.request_id ? detail + ' · 请求 ID ' + data.request_id : detail);
  }
  return data;
}
function panel(loggedIn) { $('app-panel').hidden = !loggedIn; $('login-panel').hidden = loggedIn; }
function form(id, action) {
  $(id).addEventListener('submit', async event => {
    event.preventDefault();
    const form = event.currentTarget, button = event.submitter;
    if (button) button.disabled = true;
    try { $('status').textContent = ''; await action(new FormData(form)); }
    catch (err) { $('status').textContent = err.message; }
    finally { if (button) button.disabled = false; }
  });
}
async function loadFlights() {
  const rows = await api('/api/me/itineraries');
  $('flights').replaceChildren(new Option('选择航班', ''));
  for (const row of rows) $('flights').add(new Option(row.reference+' · '+row.origin+' → '+row.destination,row.reference));
}
function threadPath() { return '/api/threads/'+encodeURIComponent($('thread').value.trim()); }
function bookingButton(label, handler) {
  const button = document.createElement('button');
  button.type = 'button';
  button.textContent = label;
  button.dataset.bookingControl = '';
  button.addEventListener('click', handler);
  return button;
}
const bookingRequests = new Set();
async function postBooking(path, endpoint, payload) {
  if (path !== threadPath() || bookingRequests.has(path)) return;
  const generation = viewGeneration, auth = authGeneration;
  bookingRequests.add(path);
  const buttons = [...document.querySelectorAll('[data-booking-control]')];
  buttons.forEach(button => { button.disabled = true; });
  $('status').textContent = '';
  let failure;
  try { await api(path + endpoint, payload); }
  catch (error) { failure = error; }
  finally {
    bookingRequests.delete(path);
    buttons.forEach(button => { button.disabled = false; });
  }
  if (path !== threadPath() || generation !== viewGeneration || auth !== authGeneration) return;
  try { await loadThread(); }
  catch (error) { failure ||= error; }
  if (failure && path === threadPath() && auth === authGeneration) $('status').textContent = failure.message;
}
function stayText(option) {
  const price = (option.total_minor / 100).toFixed(2) + ' ' + option.currency;
  return option.hotel_name + ' · ' + option.room_type + ' · ' +
    option.check_in + ' 至 ' + option.check_out + ' · 演示总价 ' + price;
}
function renderHotel(result, booking, path) {
  $('hotel-reply').textContent = result?.reply || '';
  $('hotel-options').replaceChildren();
  const busy = booking?.resume_required || ['awaiting_decision', 'decided'].includes(booking?.status);
  for (const [option_index, option] of (result?.hotel_options || []).entries()) {
    const item = document.createElement('li');
    item.textContent = stayText(option);
    if (option.demo) item.append(' · 合成库存');
    if (option.source_url) {
      try {
        const link = new URL(option.source_url);
        if (link.protocol === 'https:' && link.host === 'www.zuerich.com' &&
            !link.username && !link.password && /^\/en\/accommodation\/[a-z0-9-]+$/.test(link.pathname)) {
          const source = document.createElement('a');
          source.href = link.href;
          source.textContent = '酒店资料来源';
          source.target = '_blank';
          source.rel = 'noopener noreferrer';
          item.append(' · ', source);
          if (option.checked_on) item.append('（' + option.checked_on + ' 核对）');
        }
      } catch {
        // Ignore malformed external source metadata.
      }
    }
    if (!busy && booking?.message_id !== result.message_id) {
      item.append(' ', bookingButton('发起演示预订', () => postBooking(path, '/hotel-proposals', {
        message_id: result.message_id, option_index,
      })));
    }
    $('hotel-options').append(item);
  }
}
function renderBooking(booking, path) {
  const panel = $('booking');
  panel.replaceChildren();
  panel.hidden = !booking;
  if (!booking) return;
  const labels = {
    awaiting_decision:'等待确认', decided:'正在处理', booked:'演示预订成功',
    rejected:'已拒绝', expired:'提案已过期，请重新查询酒店',
    stale:'演示库存或价格已变化，请重新查询酒店',
  };
  const heading = document.createElement('h3');
  heading.textContent = '演示预订 · ' + labels[booking.status];
  const details = document.createElement('p');
  details.textContent = stayText(booking);
  const expiry = document.createElement('p');
  expiry.textContent = '提案有效期至 ' + new Date(booking.expires_at).toLocaleString('zh-CN');
  panel.append(heading, details, expiry);
  const decide = decision => postBooking(path, '/approvals/' + booking.action_id + '/decision', {decision});
  if (booking.resume_required && booking.decision) {
    panel.append(bookingButton('继续处理', () => decide(booking.decision)));
  } else if (booking.status === 'awaiting_decision') {
    panel.append(bookingButton('确认预订', () => decide('approve')),
      ' ', bookingButton('拒绝', () => decide('reject')));
  } else if (booking.booking_id) {
    const receipt = document.createElement('p');
    receipt.id = 'booking-receipt';
    receipt.textContent = '演示订单号 ' + booking.booking_id;
    panel.append(receipt);
  }
}
async function loadThread() {
  const path = threadPath(), generation = ++viewGeneration;
  let state;
  try { state = await api(path); }
  catch (error) {
    if (generation === viewGeneration && path === threadPath()) {
      clearThreadView();
      throw error;
    }
    return;
  }
  if (generation !== viewGeneration || path !== threadPath()) return;
  renderHotel(state.graph, state.booking, path);
  renderBooking(state.booking, path);
  $('messages').replaceChildren();
  for (const message of state.messages) { const item=document.createElement('li'); item.textContent=message.content; $('messages').append(item); }
  $('graph').textContent = state.graph ? '已完成第 '+state.graph.turn_count+' 轮 · '+state.graph.status : '会话尚无处理结果';
}
form('login',async data => {
  const auth = ++authGeneration;
  clearThreadView();
  await api('/api/auth/login',Object.fromEntries(data));
  if (auth !== authGeneration) return;
  $('login').reset(); panel(true); await loadFlights();
});
$('logout').addEventListener('click',async () => {
  ++authGeneration;
  clearThreadView();
  panel(false);
  $('thread').value = '';
  for (const key of ['flight-result','airport-result']) $(key).textContent = '';
  try { await api('/api/auth/logout',{}); }
  catch (error) { $('status').textContent = error.message; }
});
$('new-thread').addEventListener('click',async () => {
  const generation = viewGeneration;
  try {
    const thread = await api('/api/threads',{});
    if (generation !== viewGeneration) return;
    clearThreadView();
    $('thread').value = thread.thread_id;
    await loadThread();
  } catch(err){ $('status').textContent=err.message; }
});
form('session',loadThread);
form('send',async data => {
  if (!$('thread').value) throw new Error('请先新建或打开会话');
  const path = threadPath(), generation = viewGeneration;
  const result = await api(path+'/messages',{content:data.get('content')});
  if (generation !== viewGeneration || path !== threadPath()) return;
  await loadThread(); $('send').reset();
  $('status').textContent=result.reply || '已保存消息';
});
form('flight',async () => {
  if (!$('flights').value) throw new Error('请选择航班');
  $('flight-result').textContent=JSON.stringify(await api('/api/tools/flight',{reference:$('flights').value}),null,2);
});
form('airport',async data => {
  $('airport-result').textContent=JSON.stringify(await api('/api/tools/airport',{code:data.get('code').toUpperCase()}),null,2);
});
const initialAuth = authGeneration;
loadFlights().then(() => {
  if (initialAuth === authGeneration) panel(true);
}).catch(() => {
  if (initialAuth === authGeneration) panel(false);
});
</script>
</html>
